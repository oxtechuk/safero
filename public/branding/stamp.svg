<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <path id="circleTextTop" d="M 30,120 A 90,90 0 0,1 210,120" />
    <path id="circleTextBottom" d="M 210,120 A 90,90 0 0,1 30,120" />
  </defs>
  <!-- Outer double ring -->
  <circle cx="120" cy="120" r="112" fill="none" stroke="#0E4DA4" stroke-width="4" stroke-dasharray="8 4" opacity="0.9" />
  <circle cx="120" cy="120" r="104" fill="none" stroke="#0E4DA4" stroke-width="2" />
  <circle cx="120" cy="120" r="76" fill="none" stroke="#0E4DA4" stroke-width="2" />
  
  <!-- Curved texts -->
  <text font-family="'Cairo', 'Segoe UI', Arial" font-size="16" font-weight="900" fill="#0E4DA4" letter-spacing="3">
    <textPath href="#circleTextTop" startOffset="50%" text-anchor="middle">SAFERO SERVICES</textPath>
  </text>
  <text font-family="'Cairo', 'Segoe UI', Arial" font-size="13" font-weight="700" fill="#0E4DA4" letter-spacing="2">
    <textPath href="#circleTextBottom" startOffset="50%" text-anchor="middle">★ INSPECTION &amp; CERTIFICATION ★</textPath>
  </text>
  
  <!-- Center Shield and Globe/Leaf -->
  <g transform="translate(85, 82) scale(0.3)">
    <!-- Shield -->
    <path d="M120 10 L210 50 C210 160 120 220 120 220 C120 220 30 160 30 50 Z" fill="#E6F2FF" stroke="#0E4DA4" stroke-width="12" />
    <!-- Globe grid lines -->
    <circle cx="120" cy="115" r="50" fill="none" stroke="#0E4DA4" stroke-width="8"/>
    <line x1="70" y1="115" x2="170" y2="115" stroke="#0E4DA4" stroke-width="6"/>
    <ellipse cx="120" cy="115" rx="25" ry="50" fill="none" stroke="#0E4DA4" stroke-width="6"/>
    <!-- Leaf -->
    <path d="M120 135 C150 100 170 140 145 165 C125 180 120 135 120 135 Z" fill="#22A447" stroke="#22A447" stroke-width="4"/>
  </g>
  
  <!-- Stamp verification ribbon / text -->
  <rect x="52" y="152" width="136" height="20" rx="3" fill="#0E4DA4" />
  <text x="120" y="166" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">OFFICIAL SEAL</text>
</svg>

